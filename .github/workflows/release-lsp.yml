name: Release Assembly Definition LSP

on:
  push:
    tags:
      - "unity-asmdef-lsp-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: unity-asmdef-lsp-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: unity-asmdef-lsp-linux-aarch64
          - os: macos-13
            asset: unity-asmdef-lsp-macos-x86_64
          - os: macos-14
            asset: unity-asmdef-lsp-macos-aarch64
          - os: windows-latest
            asset: unity-asmdef-lsp-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p unity-asmdef-lsp
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ -f target/release/unity-asmdef-lsp.exe ]; then
            cp target/release/unity-asmdef-lsp.exe "dist/${{ matrix.asset }}"
          else
            cp target/release/unity-asmdef-lsp "dist/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
