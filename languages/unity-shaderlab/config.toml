name = "Unity ShaderLab"
grammar = "shaderlab"
path_suffixes = ["shader"]
line_comments = ["// "]
block_comment = ["/* ", " */"]
autoclose_before = "{}()[];:.,="
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
tab_size = 4
hard_tabs = false
