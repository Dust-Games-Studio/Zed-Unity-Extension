name = "Unity Assembly Definition"
grammar = "unity_json"
path_suffixes = ["asmdef", "asmref"]
tab_size = 4
hard_tabs = false
autoclose_before = ",]}"
brackets = [
    { start = "{", end = "}", close = true, surround = true, newline = true },
    { start = "[", end = "]", close = true, surround = true, newline = true },
    { start = "\"", end = "\"", close = true, surround = true, newline = false, not_in = ["string"] },
]
