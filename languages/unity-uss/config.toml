name = "Unity USS"
grammar = "css"
path_suffixes = ["uss", "tss"]
block_comment = ["/* ", " */"]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
tab_size = 4
hard_tabs = false
word_characters = ["#"]
completion_query_characters = ["-", "@"]
